<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sreerag - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        input,
        textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .social-link {
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .social-link:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body class="bg-navy text-slate font-sans" data-theme="tailwind">

    <div data-site-nav></div>

    <!-- Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-40 pb-24">

        <div class="flex items-center mb-4">
            <span class="h-px w-8 bg-cyan mr-3"></span>
            <span class="font-mono text-xs tracking-[0.2em] text-cyan uppercase">Say hello</span>
        </div>
        <h1 class="text-4xl md:text-5xl font-serif font-black text-white mb-4">
            Get In Touch
        </h1>

        <div class="max-w-2xl mx-auto text-center fade-in mt-12">
            <p class="text-lg text-slate mb-12">
                Although I'm not currently looking for any new opportunities, my inbox is always open. Whether
                you have a question or just want to say hi, I'll try my best to get back to you!
            </p>

            <form id="contact-form" class="text-left space-y-6 bg-cardNavy portfolio-card rounded-xl p-8">
                <div>
                    <label for="name" class="block text-sm font-medium text-white mb-2">Name</label>
                    <input type="text" id="name" name="name"
                        class="w-full bg-navy border border-white/10 rounded focus:border-cyan focus:ring-1 focus:ring-cyan text-white px-4 py-3 outline-none"
                        placeholder="John Doe">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-white mb-2">Email</label>
                    <input type="email" id="email" name="email"
                        class="w-full bg-navy border border-white/10 rounded focus:border-cyan focus:ring-1 focus:ring-cyan text-white px-4 py-3 outline-none"
                        placeholder="john@example.com">
                </div>

                <div>
                    <label for="message" class="block text-sm font-medium text-white mb-2">Message</label>
                    <textarea id="message" name="message" rows="5"
                        class="w-full bg-navy border border-white/10 rounded focus:border-cyan focus:ring-1 focus:ring-cyan text-white px-4 py-3 outline-none"
                        placeholder="Hello! I'd like to discuss..."></textarea>
                </div>

                <div class="text-center pt-4">
                    <button type="submit"
                        class="inline-block border-2 border-cyan text-cyan font-mono px-8 py-4 rounded hover:bg-cyan/10 transition duration-300 w-full md:w-auto">
                        Send Message
                    </button>
                    <p id="form-message" class="mt-4 text-center hidden"></p>
                </div>
            </form>

            <div class="mt-16 pt-8 border-t border-white/5">
                <h3 class="text-cyan text-lg font-serif font-bold mb-6">Connect with me</h3>
                <div class="flex justify-center space-x-8" data-social-links="linkedin,github,google"
                    data-social-variant="labelled"></div>
            </div>

        </div>
    </main>

    <div data-site-footer></div>

    <script src="assets/js/site-chrome.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
