<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#cyanBlueGrad)" stroke-width="2.5"/>
  
  <!-- Ambient Inner Glow Dot -->
  <circle cx="52" cy="12" r="3" fill="#06b6d4" filter="url(#neonGlow)"/>
  
  <!-- Stylized Monogram S -->
  <path d="M42 22 C42 16 26 16 26 25 C26 34 38 30 38 40 C38 48 22 48 22 42" 
        fill="none" 
        stroke="url(#cyanBlueGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>
  <circle cx="22" cy="42" r="2.5" fill="#38bdf8"/>
  <circle cx="42" cy="22" r="2.5" fill="#a855f7"/>
</svg>

